# Alembic configuration for the optional SteelAI Enterprise Lab PostgreSQL schema.
#
# No connection string is stored here: env.py resolves it from the explicit
# STEELAI_ENTERPRISE_DATABASE_URL environment variable (or an explicit override
# passed by the caller). This file must never contain a user, password or host.
#
# Usage (from the repository root):
#   .\.venv\Scripts\python.exe -m alembic -c alembic-enterprise.ini upgrade head
#   .\.venv\Scripts\python.exe -m alembic -c alembic-enterprise.ini current
#   .\.venv\Scripts\python.exe -m alembic -c alembic-enterprise.ini downgrade base

[alembic]
script_location = migrations/enterprise
prepend_sys_path = .
path_separator = os
# The version table lives inside the dedicated schema so it never collides with
# other tooling in the same database. The schema is created by the baseline
# migration itself (via the version_table_schema creation hook in env.py).
version_table = alembic_version_enterprise
version_table_schema = steelai_enterprise
timezone = UTC
# Autogenerate is intentionally not the source of truth: the baseline migration is
# hand written and reviewed. Keep a deterministic compare so drift is visible.
compare_type = true
compare_server_default = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
