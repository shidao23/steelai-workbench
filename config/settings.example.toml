[project]
name = "SteelAI Workbench"
version = "0.10.0-research-data-contract"
timezone = "Asia/Shanghai"

[sources]
# Keep local research paths only in the ignored config/settings.toml file.
research_root = ""
experiment_root = ""
workbench_root = ""
master_workbook = ""
wearsteel_v01_root = ""

[tools]
# Keep machine-specific executables and research file paths in ignored config/settings.toml.
# steeldata_project: absolute path, or a path relative to the Workbench root, pointing at
# the SteelData project. Empty keeps the legacy sibling lookup (../SteelData next to the
# Workbench root). A configured but invalid location fails closed; it never silently
# falls back to the sibling. Keep real machine paths in ignored config/settings.toml only.
steeldata_project = ""
# steeldata_python: absolute path to the SteelData interpreter. Empty keeps
# <steeldata_project>/.venv. Useful when SteelData keeps its virtual environment
# in place while its source tree moves.
steeldata_python = ""
# steelstats_project: absolute path, or a path relative to the Workbench root, pointing at
# the SteelStats project. Empty keeps the legacy sibling lookup (../SteelStats next to the
# Workbench root). A configured but invalid location fails closed; it never silently
# falls back to the sibling. Keep real machine paths in ignored config/settings.toml only.
steelstats_project = ""
# life_knowledge_root: absolute path, or a path relative to the Workbench root, to the
# container directory that holds the LifeAgents and AI_assistant owner projects. Empty
# keeps the legacy sibling lookup (the directory next to the Workbench root). The owners
# and the shared platform no longer share one parent, so both roots are configured
# separately. Keep real machine paths in ignored config/settings.toml only.
life_knowledge_root = ""
# agent_platform_root: absolute path, or a path relative to the Workbench root, to the
# shared Shidao platform directory. Empty keeps the legacy sibling lookup
# (../_agent_platform next to the Workbench root).
agent_platform_root = ""
# calphad_python: absolute path to the isolated pycalphad interpreter. Empty keeps the
# repository default <workbench root>/.venv-pycalphad/Scripts/python.exe. The isolated
# environment is protected in place while the source tree moves, so point this at the
# existing interpreter instead of recreating it. The STEELAI_CALPHAD_PYTHON environment
# variable takes precedence. Keep real machine paths in ignored config/settings.toml only.
calphad_python = ""
microsam_python = ""
review30_root = ""
matlab_exe = ""
mtex_root = ""
ebsd_pilot_ctf = ""
ebsd_matched_b_ctf = ""
ebsd_matched_r_ctf = ""
ebsd_highres_r_ctf = ""
composition_mcp_server = ""
# materials_agent_project: absolute path to the migrated MaterialsResearchAgent root
# (default <engineering container>/04_Materials_Research_Agent). The source moved while
# its runtime environment stayed in place, so materials_agent_python must point at the
# retained interpreter; the new root has no virtual environment of its own.
materials_agent_project = ""
# materials_agent_python: absolute path to the MaterialsResearchAgent interpreter.
# Empty means "not registered" and the Materials Research capabilities report as
# unavailable instead of guessing a path.
materials_agent_python = ""
# microsam_script / calphad_script: the registered tool entry scripts. Empty keeps the
# repository default under <workspace>/06_Tools/01_Applications/... .
microsam_script = ""
calphad_script = ""
# microsam_checkpoint / calphad_tdb: registered model weights and database. Empty keeps
# the repository default under <workspace>/06_Tools/03_Models and .../04_Databases.
microsam_checkpoint = ""
calphad_tdb = ""

[research_web]
# WO-31 React research workbench. Everything derivable from the repository location is
# derived (workspace root, work/output roots, the shared tool scripts, models and
# databases, and the SteelData/SteelStats/MRA project roots). Only machine-specific
# values belong here, and they stay in the ignored config/settings.toml.
workspace_root = ""
work_root = ""
output_root = ""
run_root = ""
synthetic_root = ""
streamlit_url = ""
allowed_origins = ""
# tool_env_roots: the trusted roots a configured interpreter must resolve inside.
# Empty means every interpreter that is not under a project root is reported as
# untrusted in /api/health (it never blocks a run by itself).
tool_env_roots = []

[ai]
# CI and public examples are deterministic and offline.
enabled = false
provider = "deepseek"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/beta"
structured_data_only = true
reasoning_effort = "low"
max_tool_calls = 6
max_rounds = 4
