name: SteelAI Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic application dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare synthetic public CI fixtures
        run: python -m steelai.public_workspace

      - name: Audit the Git-tracked public candidate
        run: python -m steelai.public_release_audit

      - name: Validate scientific data, Agent benchmark and privacy contracts
        run: python -m steelai.quality_gate

      - name: Run the full offline test suite
        run: python -m unittest discover -s tests -v

  optional-frictionless-adapter:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-frictionless-win-py312.lock

      - name: Install hash-locked optional adapter
        run: python -m pip install --require-hashes -r requirements-frictionless-win-py312.lock

      - name: Validate installed and disabled adapter paths
        run: python -m unittest tests.test_frictionless_adapter -v
