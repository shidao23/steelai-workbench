name: SteelAI Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic application dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare synthetic public CI fixtures
        run: |
          mkdir -p data/processed data/index
          cp data/examples/processed/*.csv data/processed/
          cp data/examples/index/evidence_index.csv data/index/evidence_index.csv

      - name: Enforce the public publication boundary
        run: python -m steelai.publication_gate

      - name: Validate scientific data, Agent benchmark and privacy contracts
        run: python -m steelai.quality_gate

      - name: Run the full offline test suite
        run: python -m unittest discover -s tests -v
